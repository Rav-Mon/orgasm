<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sensual Audio Player</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #0d0608;
      --bg-card: #1a0d10;
      --burgundy: #722F37;
      --burgundy-light: #8B3A44;
      --rose-gold: #B76E79;
      --rose-gold-light: #D4A5AB;
      --cream: #F5E6E0;
      --cream-muted: #C9B8B0;
      --accent-warm: #C17F59;
      --accent-glow: rgba(183, 110, 121, 0.4);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--bg-deep);
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--cream);
    }

    .font-display {
      font-family: 'Cormorant Garamond', serif;
    }

    /* Ambient background */
    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }

    .ambient-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.5;
      animation: float 20s ease-in-out infinite;
    }

    .orb-1 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, var(--burgundy) 0%, transparent 70%);
      top: -100px;
      right: -100px;
      animation-delay: 0s;
    }

    .orb-2 {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, var(--rose-gold) 0%, transparent 70%);
      bottom: -50px;
      left: -50px;
      animation-delay: -7s;
      opacity: 0.3;
    }

    .orb-3 {
      width: 250px;
      height: 250px;
      background: radial-gradient(circle, var(--accent-warm) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: -14s;
      opacity: 0.25;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(30px, -30px) scale(1.05); }
      50% { transform: translate(-20px, 20px) scale(0.95); }
      75% { transform: translate(20px, 10px) scale(1.02); }
    }

    /* Particle canvas */
    #particleCanvas {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    /* Main container */
    .player-container {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    /* Album art */
    .album-wrapper {
      position: relative;
      width: 280px;
      height: 280px;
      margin-bottom: 2rem;
    }

    @media (min-width: 640px) {
      .album-wrapper {
        width: 320px;
        height: 320px;
      }
    }

    .album-glow {
      position: absolute;
      inset: -30px;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      border-radius: 50%;
      animation: pulse-glow 3s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
    }

    .album-outer-ring {
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 1px solid rgba(183, 110, 121, 0.3);
      animation: ring-rotate 30s linear infinite;
      animation-play-state: paused;
    }

    .album-outer-ring::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 8px;
      height: 8px;
      background: var(--rose-gold);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--rose-gold);
    }

    .album-outer-ring.playing {
      animation-play-state: running;
    }

    @keyframes ring-rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .album-art {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 
        0 20px 60px rgba(0, 0, 0, 0.5),
        0 0 0 4px var(--rose-gold),
        inset 0 0 60px rgba(0, 0, 0, 0.3);
      animation: gentle-rotate 40s linear infinite;
      animation-play-state: paused;
    }

    .album-art.playing {
      animation-play-state: running;
    }

    @keyframes gentle-rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .album-art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .album-vignette {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        transparent 40%,
        rgba(13, 6, 8, 0.2) 70%,
        rgba(13, 6, 8, 0.5) 100%
      );
      pointer-events: none;
    }

    .album-inner-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 2px solid rgba(183, 110, 121, 0.6);
      box-shadow: 
        0 0 15px rgba(183, 110, 121, 0.3),
        inset 0 0 10px rgba(183, 110, 121, 0.2);
      pointer-events: none;
      opacity: 0.8;
    }

    .album-inner-ring::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 8px;
      height: 8px;
      background: var(--rose-gold);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--rose-gold);
    }

    /* Track info */
    .track-info {
      text-align: center;
      margin-bottom: 2rem;
      opacity: 0;
      animation: fade-up 0.8s ease-out 0.2s forwards;
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .track-title {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, var(--cream) 0%, var(--rose-gold-light) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .track-artist {
      font-size: 0.95rem;
      color: var(--cream-muted);
      font-weight: 300;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* Progress bar */
    .progress-container {
      width: 100%;
      max-width: 400px;
      margin-bottom: 1.5rem;
      opacity: 0;
      animation: fade-up 0.8s ease-out 0.4s forwards;
    }

    .progress-bar {
      position: relative;
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      cursor: pointer;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--burgundy) 0%, var(--rose-gold) 100%);
      border-radius: 3px;
      width: 0%;
      position: relative;
      transition: width 0.1s linear;
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      background: var(--rose-gold);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--rose-gold);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .progress-bar:hover .progress-fill::after {
      opacity: 1;
    }

    .time-display {
      display: flex;
      justify-content: space-between;
      margin-top: 0.5rem;
      font-size: 0.75rem;
      color: var(--cream-muted);
      font-weight: 300;
      letter-spacing: 0.05em;
    }

    /* Controls */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      margin-bottom: 2rem;
      opacity: 0;
      animation: fade-up 0.8s ease-out 0.6s forwards;
    }

    .control-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0.5rem;
      transition: all 0.3s ease;
      color: var(--cream-muted);
    }

    .control-btn:hover {
      color: var(--rose-gold);
      transform: scale(1.1);
    }

    .control-btn:active {
      transform: scale(0.95);
    }

    .control-btn svg {
      width: 24px;
      height: 24px;
    }

    .play-btn {
      width: 70px;
      height: 70px;
      background: linear-gradient(135deg, var(--burgundy) 0%, var(--burgundy-light) 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 
        0 10px 30px rgba(114, 47, 55, 0.4),
        0 0 0 3px rgba(183, 110, 121, 0.3);
      transition: all 0.3s ease;
    }

    .play-btn:hover {
      transform: scale(1.05);
      box-shadow: 
        0 15px 40px rgba(114, 47, 55, 0.5),
        0 0 0 4px rgba(183, 110, 121, 0.4);
    }

    .play-btn:active {
      transform: scale(0.98);
    }

    .play-btn svg {
      width: 28px;
      height: 28px;
      color: var(--cream);
    }

    /* Volume */
    .volume-container {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 2rem;
      opacity: 0;
      animation: fade-up 0.8s ease-out 0.8s forwards;
    }

    .volume-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--cream-muted);
      transition: color 0.3s;
    }

    .volume-btn:hover {
      color: var(--rose-gold);
    }

    .volume-btn svg {
      width: 20px;
      height: 20px;
    }

    .volume-slider {
      width: 100px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      background: var(--rose-gold);
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 8px var(--rose-gold);
    }

    .volume-slider::-moz-range-thumb {
      width: 12px;
      height: 12px;
      background: var(--rose-gold);
      border-radius: 50%;
      cursor: pointer;
      border: none;
      box-shadow: 0 0 8px var(--rose-gold);
    }

    /* Visualizer */
    .visualizer-container {
      width: 100%;
      max-width: 400px;
      height: 60px;
      margin-bottom: 2rem;
      opacity: 0;
      animation: fade-up 0.8s ease-out 1s forwards;
    }

    #visualizer {
      width: 100%;
      height: 100%;
    }

    /* Playlist */
    .playlist-section {
      width: 100%;
      max-width: 400px;
      opacity: 0;
      animation: fade-up 0.8s ease-out 1.2s forwards;
    }

    .playlist-header {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--rose-gold);
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid rgba(183, 110, 121, 0.2);
    }

    .playlist-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      background: transparent;
      border: 1px solid transparent;
    }

    .playlist-item:hover {
      background: rgba(183, 110, 121, 0.1);
      border-color: rgba(183, 110, 121, 0.2);
    }

    .playlist-item.active {
      background: rgba(114, 47, 55, 0.3);
      border-color: var(--rose-gold);
    }

    .playlist-thumb {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .playlist-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .playlist-info {
      flex: 1;
      min-width: 0;
    }

    .playlist-item-title {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--cream);
      margin-bottom: 0.25rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .playlist-item-artist {
      font-size: 0.75rem;
      color: var(--cream-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .playlist-duration {
      font-size: 0.7rem;
      color: var(--cream-muted);
    }

    /* Audio element */
    audio {
      display: none;
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .ambient-orb,
      .album-art,
      .album-glow,
      .album-outer-ring {
        animation: none;
      }
      
      * {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* Mobile touch improvements */
    @media (hover: none) {
      .progress-fill::after {
        opacity: 1;
        width: 18px;
        height: 18px;
      }
    }
    
    /* Loading indicator */
    .loading-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: var(--rose-gold);
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    
    .loading-indicator.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <!-- Ambient Background -->
  <div class="ambient-bg">
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>
  </div>

  <!-- Particle Canvas -->
  <canvas id="particleCanvas"></canvas>

  <!-- Player Container -->
  <div class="player-container">
    <!-- Album Art -->
    <div class="album-wrapper">
      <div class="album-glow"></div>
      <div class="album-outer-ring" id="outerRing"></div>
      <div class="album-art" id="albumArt">
        <img id="albumImage" src="" alt="Album Art">
        <div class="album-vignette"></div>
        <div class="album-inner-ring"></div>
        <div class="loading-indicator" id="loadingIndicator">BUFFERING...</div>
      </div>
    </div>

    <!-- Track Info -->
    <div class="track-info">
      <h1 class="track-title font-display" id="trackTitle">Evening Whispers</h1>
      <p class="track-artist" id="trackArtist">Velvet Foreplay</p>
    </div>

    <!-- Progress Bar -->
    <div class="progress-container">
      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="time-display">
        <span id="currentTime">0:00</span>
        <span id="totalTime">0:00</span>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="control-btn" id="prevBtn" aria-label="Previous track">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="19 20 9 12 19 4 19 20"></polygon>
          <line x1="5" y1="19" x2="5" y2="5"></line>
        </svg>
      </button>
      
      <button class="control-btn play-btn" id="playBtn" aria-label="Play">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
          <rect x="6" y="4" width="4" height="16"></rect>
          <rect x="14" y="4" width="4" height="16"></rect>
        </svg>
      </button>
      
      <button class="control-btn" id="nextBtn" aria-label="Next track">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5 4 15 12 5 20 5 4"></polygon>
          <line x1="19" y1="5" x2="19" y2="19"></line>
        </svg>
      </button>
    </div>

    <!-- Volume -->
    <div class="volume-container">
      <button class="volume-btn" id="volumeBtn" aria-label="Mute">
        <svg id="volumeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
        </svg>
        <svg id="muteIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <line x1="23" y1="9" x2="17" y2="15"></line>
          <line x1="17" y1="9" x2="23" y2="15"></line>
        </svg>
      </button>
      <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="0.7" aria-label="Volume">
    </div>

    <!-- Visualizer -->
    <div class="visualizer-container">
      <canvas id="visualizer"></canvas>
    </div>

    <!-- Playlist -->
    <div class="playlist-section">
      <div class="playlist-header">Playlist</div>
      <div id="playlist"></div>
    </div>

    <!-- Audio Element - CRITICAL: crossorigin attribute added -->
    <audio id="audioPlayer" preload="metadata" crossorigin="anonymous"></audio>
  </div>

  <script>
    // ============================================
    // PLAYLIST DATA
    // ============================================
    const playlist = [
      {
        title: "Evening Whispers",
        artist: "Velvet Foreplay",
        src: "orgasm.mp3",
        image: "gel2.jpg",
        duration: "8:06"
      },
    ];

    // ============================================
    // PLAYER CODE
    // ============================================
    
    // DOM Elements
    const audioPlayer = document.getElementById('audioPlayer');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const currentTimeEl = document.getElementById('currentTime');
    const totalTimeEl = document.getElementById('totalTime');
    const volumeSlider = document.getElementById('volumeSlider');
    const volumeBtn = document.getElementById('volumeBtn');
    const volumeIcon = document.getElementById('volumeIcon');
    const muteIcon = document.getElementById('muteIcon');
    const trackTitle = document.getElementById('trackTitle');
    const trackArtist = document.getElementById('trackArtist');
    const albumArt = document.getElementById('albumArt');
    const albumImage = document.getElementById('albumImage');
    const outerRing = document.getElementById('outerRing');
    const playlistEl = document.getElementById('playlist');
    const loadingIndicator = document.getElementById('loadingIndicator');

    // State
    let currentTrack = 0;
    let isPlaying = false;
    let previousVolume = 0.7;

    // Audio Context for Visualizer
    let audioContext = null;
    let analyser = null;
    let sourceNode = null;
    let dataArray = null;
    let visualizerInitialized = false;
    let audioContextResumed = false;

    // Initialize
    function init() {
      loadTrack(currentTrack);
      renderPlaylist();
      setupEventListeners();
      initParticles();
      initVisualizer();
    }

    // Load track
    function loadTrack(index) {
      const track = playlist[index];
      audioPlayer.src = track.src;
      trackTitle.textContent = track.title;
      trackArtist.textContent = track.artist;
      albumImage.src = track.image;
      totalTimeEl.textContent = track.duration;
      currentTrack = index;
      
      // Update playlist active state
      document.querySelectorAll('.playlist-item').forEach((item, i) => {
        item.classList.toggle('active', i === index);
      });

      progressFill.style.width = '0%';
      currentTimeEl.textContent = '0:00';
    }

    // Format time
    function formatTime(seconds) {
      if (isNaN(seconds)) return '0:00';
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    // Initialize Audio Context (Must be called on user click)
    function initAudioContext() {
      if (visualizerInitialized) return;

      try {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        
        // Create nodes
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;
        
        sourceNode = audioContext.createMediaElementSource(audioPlayer);
        
        // Connect: Source -> Analyser -> Destination (Speakers)
        sourceNode.connect(analyser);
        analyser.connect(audioContext.destination);
        
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        visualizerInitialized = true;
        
        console.log("AudioContext initialized successfully");
      } catch (err) {
        console.error("Error initializing AudioContext:", err);
        // Fallback: Audio will play via default HTML5 element, but visualizer won't work
      }
    }

    // Toggle play/pause
    async function togglePlay() {
      // CRITICAL: Initialize AudioContext on first click
      if (!visualizerInitialized) {
        initAudioContext();
      }

      // CRITICAL: Resume AudioContext if suspended (Browser Autoplay Policy)
      if (audioContext && audioContext.state === 'suspended') {
        await audioContext.resume();
        audioContextResumed = true;
      }

      if (isPlaying) {
        audioPlayer.pause();
      } else {
        // Show loading indicator
        loadingIndicator.classList.add('show');
        
        const playPromise = audioPlayer.play();
        
        if (playPromise !== undefined) {
          playPromise.then(() => {
            loadingIndicator.classList.remove('show');
          }).catch(error => {
            loadingIndicator.classList.remove('show');
            console.error("Playback failed:", error);
          });
        }
      }
    }

    // Update play state
    function updatePlayState() {
      isPlaying = !audioPlayer.paused;
      playIcon.style.display = isPlaying ? 'none' : 'block';
      pauseIcon.style.display = isPlaying ? 'block' : 'none';
      albumArt.classList.toggle('playing', isPlaying);
      outerRing.classList.toggle('playing', isPlaying);
    }

    // Previous track
    function prevTrack() {
      currentTrack = (currentTrack - 1 + playlist.length) % playlist.length;
      loadTrack(currentTrack);
      if (isPlaying) {
        audioPlayer.play().catch(() => {});
      }
    }

    // Next track
    function nextTrack() {
      currentTrack = (currentTrack + 1) % playlist.length;
      loadTrack(currentTrack);
      if (isPlaying) {
        audioPlayer.play().catch(() => {});
      }
    }

    // Seek
    function seek(e) {
      const rect = progressBar.getBoundingClientRect();
      const percent = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      if (audioPlayer.duration && !isNaN(audioPlayer.duration)) {
        audioPlayer.currentTime = percent * audioPlayer.duration;
      }
    }

    // Volume
    function setVolume(value) {
      audioPlayer.volume = value;
      volumeSlider.value = value;
      
      const isMuted = value == 0;
      volumeIcon.style.display = isMuted ? 'none' : 'block';
      muteIcon.style.display = isMuted ? 'block' : 'none';
    }

    // Toggle mute
    function toggleMute() {
      if (audioPlayer.volume > 0) {
        previousVolume = audioPlayer.volume;
        setVolume(0);
      } else {
        setVolume(previousVolume);
      }
    }

    // Render playlist
    function renderPlaylist() {
      playlistEl.innerHTML = playlist.map((track, index) => `
        <div class="playlist-item ${index === currentTrack ? 'active' : ''}" data-index="${index}">
          <div class="playlist-thumb">
            <img src="${track.image}" alt="${track.title}">
          </div>
          <div class="playlist-info">
            <div class="playlist-item-title">${track.title}</div>
            <div class="playlist-item-artist">${track.artist}</div>
          </div>
          <div class="playlist-duration">${track.duration}</div>
        </div>
      `).join('');
    }

    // Event Listeners
    function setupEventListeners() {
      playBtn.addEventListener('click', togglePlay);
      prevBtn.addEventListener('click', prevTrack);
      nextBtn.addEventListener('click', nextTrack);
      volumeSlider.addEventListener('input', (e) => setVolume(e.target.value));
      volumeBtn.addEventListener('click', toggleMute);
      progressBar.addEventListener('click', seek);
      
      audioPlayer.addEventListener('play', updatePlayState);
      audioPlayer.addEventListener('pause', updatePlayState);
      
      audioPlayer.addEventListener('timeupdate', () => {
        if (audioPlayer.duration && !isNaN(audioPlayer.duration)) {
          const percent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
          progressFill.style.width = `${percent}%`;
          currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
        }
      });
      
      audioPlayer.addEventListener('loadedmetadata', () => {
        if (audioPlayer.duration && !isNaN(audioPlayer.duration)) {
           totalTimeEl.textContent = formatTime(audioPlayer.duration);
        }
      });
      
      audioPlayer.addEventListener('waiting', () => {
        loadingIndicator.classList.add('show');
      });
      
      audioPlayer.addEventListener('canplay', () => {
        loadingIndicator.classList.remove('show');
      });

      audioPlayer.addEventListener('ended', nextTrack);

      // Playlist click
      playlistEl.addEventListener('click', (e) => {
        const item = e.target.closest('.playlist-item');
        if (item) {
          const index = parseInt(item.dataset.index);
          loadTrack(index);
          togglePlay();
        }
      });

      // Touch support for progress bar
      let isDragging = false;
      progressBar.addEventListener('touchstart', (e) => {
        isDragging = true;
        seek(e.touches[0]);
      });
      document.addEventListener('touchmove', (e) => {
        if (isDragging) {
          const touch = e.touches[0];
          const rect = progressBar.getBoundingClientRect();
          if (touch.clientX >= rect.left && touch.clientX <= rect.right) {
            seek(touch);
          }
        }
      });
      document.addEventListener('touchend', () => {
        isDragging = false;
      });

      // Keyboard controls
      document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault();
          togglePlay();
        } else if (e.code === 'ArrowLeft') {
          audioPlayer.currentTime = Math.max(0, audioPlayer.currentTime - 5);
        } else if (e.code === 'ArrowRight') {
          if (audioPlayer.duration) {
            audioPlayer.currentTime = Math.min(audioPlayer.duration, audioPlayer.currentTime + 5);
          }
        }
      });
    }

    // ============================================
    // PARTICLE SYSTEM
    // ============================================
    const particleCanvas = document.getElementById('particleCanvas');
    const pCtx = particleCanvas.getContext('2d');
    let particles = [];

    function initParticles() {
      resizeParticleCanvas();
      window.addEventListener('resize', resizeParticleCanvas);
      
      for (let i = 0; i < 50; i++) {
        particles.push({
          x: Math.random() * particleCanvas.width,
          y: Math.random() * particleCanvas.height,
          size: Math.random() * 3 + 1,
          speedX: (Math.random() - 0.5) * 0.5,
          speedY: (Math.random() - 0.5) * 0.5,
          opacity: Math.random() * 0.5 + 0.1
        });
      }
      
      animateParticles();
    }

    function resizeParticleCanvas() {
      particleCanvas.width = window.innerWidth;
      particleCanvas.height = window.innerHeight;
    }

    function animateParticles() {
      pCtx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
      
      particles.forEach(p => {
        p.x += p.speedX;
        p.y += p.speedY;
        
        if (p.x < 0) p.x = particleCanvas.width;
        if (p.x > particleCanvas.width) p.x = 0;
        if (p.y < 0) p.y = particleCanvas.height;
        if (p.y > particleCanvas.height) p.y = 0;
        
        pCtx.beginPath();
        pCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        pCtx.fillStyle = `rgba(183, 110, 121, ${p.opacity})`;
        pCtx.fill();
      });
      
      requestAnimationFrame(animateParticles);
    }

    // ============================================
    // AUDIO VISUALIZER
    // ============================================
    const visualizerCanvas = document.getElementById('visualizer');
    const vCtx = visualizerCanvas.getContext('2d');

    function initVisualizer() {
      visualizerCanvas.width = visualizerCanvas.offsetWidth * 2;
      visualizerCanvas.height = visualizerCanvas.offsetHeight * 2;
      vCtx.scale(2, 2);
      drawVisualizer();
    }

    function drawVisualizer() {
      const width = visualizerCanvas.offsetWidth;
      const height = visualizerCanvas.offsetHeight;
      
      vCtx.clearRect(0, 0, width, height);
      
      if (analyser && isPlaying) {
        analyser.getByteFrequencyData(dataArray);
        
        const barWidth = width / 64;
        let x = 0;
        
        for (let i = 0; i < 64; i++) {
          const barHeight = (dataArray[i] / 255) * height * 0.8;
          
          const gradient = vCtx.createLinearGradient(0, height, 0, height - barHeight);
          gradient.addColorStop(0, '#722F37');
          gradient.addColorStop(1, '#B76E79');
          
          vCtx.fillStyle = gradient;
          vCtx.fillRect(x, height - barHeight, barWidth - 2, barHeight);
          
          x += barWidth;
        }
      } else {
        // Idle animation
        const barWidth = width / 32;
        const time = Date.now() / 1000;
        
        for (let i = 0; i < 32; i++) {
          const barHeight = Math.sin(time * 2 + i * 0.3) * 5 + 8;
          vCtx.fillStyle = `rgba(183, 110, 121, ${0.3 + Math.sin(time + i * 0.2) * 0.1})`;
          vCtx.fillRect(i * barWidth, height - barHeight, barWidth - 2, barHeight);
        }
      }
      
      requestAnimationFrame(drawVisualizer);
    }

    // Start
    init();
  </script>
</body>
</html>
